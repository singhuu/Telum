# Builds a signed release APK from a version tag and makes a DRAFT GitHub release.
# A maintainer tests the draft's APK on a TV device, records the result, then publishes it.
# Set-up and the release procedure: docs/RELEASING.md.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write       # create the draft release
  id-token: write       # sign the build provenance attestation
  attestations: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash   # adds -o pipefail to every step
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Check the tag against the app version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name in app/build.gradle.kts."
            exit 1
          fi
          if ! awk -v v="$name" '$1 == "##" && $2 == v {found = 1} END {exit !found}' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $name' section."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.TELUM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The TELUM_KEYSTORE_BASE64 secret is not set. See docs/RELEASING.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "TELUM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Check and build the signed release
        env:
          TELUM_STORE_PASSWORD: ${{ secrets.TELUM_STORE_PASSWORD }}
          TELUM_KEY_ALIAS: ${{ secrets.TELUM_KEY_ALIAS }}
          TELUM_KEY_PASSWORD: ${{ secrets.TELUM_KEY_PASSWORD }}
        run: ./gradlew :app:behaviorChecks :app:assembleRelease :app:lintRelease

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify the signature and write the checksum
        id: apk
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk dist/telum.apk
          "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/telum.apk | tee certificate.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' certificate.txt
          fingerprint=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certificate.txt)
          if [ -z "$fingerprint" ]; then echo "::error::No signing certificate found."; exit 1; fi
          (cd dist && sha256sum telum.apk > SHA256SUMS)
          echo "sha256=$(cut -d' ' -f1 dist/SHA256SUMS)" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/telum.apk

      - name: Keep the R8 mapping file
        uses: actions/upload-artifact@v4
        with:
          name: telum-${{ steps.version.outputs.name }}-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          FINGERPRINT: ${{ steps.apk.outputs.fingerprint }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          {
            echo "## Install"
            echo
            echo "Use an AI agent to install Telum. Follow the [installation guide]($base/README.md#install-telum)."
            echo "To install without an agent, use the [manual installation guide]($base/docs/INSTALL.md)."
            echo
            echo "Android 10 or newer is necessary. Telum is optimized for NVIDIA SHIELD TV."
            echo
            echo "## What changed"
            echo
            awk -v v="$VERSION" '$1 == "##" && $2 == v {found = 1; next} found && /^## / {exit} found {print}' CHANGELOG.md
            echo
            echo "## Device tests"
            echo
            echo "MAINTAINER: replace this line with the device tests of this exact APK before you publish."
            echo
            echo "## File identity"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Version | $VERSION (version code $CODE) |"
            echo "| Source | [\`$GITHUB_REF_NAME\`](https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME), commit \`$GITHUB_SHA\` |"
            echo "| APK | \`telum.apk\` |"
            echo "| APK SHA-256 | \`$SHA256\` |"
            echo "| Signing certificate SHA-256 | \`$FINGERPRINT\` |"
            echo
            echo "GitHub Actions built this APK from the tagged source. To examine the build record, use the GitHub CLI:"
            echo
            echo '```sh'
            echo "gh attestation verify telum.apk --repo $GITHUB_REPOSITORY"
            echo '```'
          } > notes.md
          cat notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/telum.apk dist/SHA256SUMS \
            --draft --verify-tag --title "Telum $VERSION" --notes-file notes.md
